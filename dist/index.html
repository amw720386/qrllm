<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>QRLLM</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <p id="message" role="status" data-state="empty">what are you doing here?</p>
  <main id="lab" hidden>
    <a class="back" href="https://ahamedwajibu.com/" aria-label="Back to ahamedwajibu.com">←</a>
    <div class="workspace">
      <h1>QRLLM</h1>
      <form id="generate-form">
        <input id="prefix" aria-label="Starting letters" placeholder="Starting letters, then Enter" type="text" pattern="[A-Za-z]*" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go">
        <output id="result" for="prefix" aria-label="Generated name" aria-live="off"></output>
        <span id="announcement" class="sr-only" role="status"></span>
      </form>
      <figure class="pipeline">
        <svg viewBox="0 0 600 96" aria-hidden="true">
          <path class="trace" d="M100 48h48l18-18h66l18 18h100l18 18h66l18-18h48"/>
          <path class="signal" pathLength="100" d="M100 48h48l18-18h66l18 18h100l18 18h66l18-18h48"/>
          <g class="node" transform="translate(76 24)">
            <rect width="48" height="48"/>
            <path d="M8 8h12v12H8zm20 0h12v12H28zM8 28h12v12H8z"/>
            <path class="pixel" d="M12 12h4v4h-4zm20 0h4v4h-4zM12 32h4v4h-4zm16-8h4v4h-4zm8 0h4v4h-4zm-4 4h4v4h-4zm-4 4h4v4h-4zm8 4h4v4h-4z"/>
          </g>
          <g class="node" transform="translate(276 24)">
            <rect width="48" height="48"/>
            <path d="M8 8h32v32H8zm0 8h32m-32 8h32m-32 8h32M16 8v32m8-32v32m8-32v32"/>
            <path class="pixel" d="M8 8h8v8H8zm16 8h8v8h-8zm8 8h8v8h-8zm-16 8h8v8h-8z"/>
          </g>
          <g class="node" transform="translate(476 24)">
            <rect width="48" height="48"/>
            <path d="M8 27h7l5-10 6 16 6-13 4 7h4"/>
          </g>
        </svg>
        <figcaption>
          <ol role="list" aria-label="How the scanned model runs">
            <li>QR payload</li>
            <li>Pretrained weights</li>
            <li>Local inference</li>
          </ol>
        </figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
